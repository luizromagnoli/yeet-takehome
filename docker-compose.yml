services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yeet
      POSTGRES_PASSWORD: yeet
      POSTGRES_DB: yeet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yeet -d yeet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://yeet:yeet@postgres:5432/yeet
      BET_PROCESSOR_HMAC_SECRET: test
      PORT: "3000"
      NODE_ENV: production
      MIGRATE_ON_BOOT: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
